<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 - 커뮤니티</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 500; }
        .write-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1.75rem;
        }
        .form-label { font-size: 13px; color: #6c757d; }
        #title-input { font-size: 16px; font-weight: 500; }
        .char-count { font-size: 12px; color: #adb5bd; text-align: right; }
        .toastui-editor-defaultUI { border: 1px solid #dee2e6; border-radius: 8px; overflow: hidden; }
    </style>
    <script src="/js/nav.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" href="/index.html">커뮤니티</a>
            <div class="ms-auto d-flex align-items-center gap-2" id="nav-auth"></div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 860px;">
        <a id="back-link" href="/index.html" class="text-muted small text-decoration-none d-block mb-3">← 목록으로</a>

        <div class="write-card">
            <div class="mb-3">
                <label class="form-label">제목</label>
                <input type="text" id="title-input" class="form-control" placeholder="제목을 입력하세요" maxlength="200">
                <div class="char-count mt-1"><span id="title-count">0</span>/200</div>
            </div>
            <div class="mb-4">
                <label class="form-label">내용</label>
                <div id="editor"></div>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-outline-secondary" onclick="goBack()">취소</button>
                <button class="btn btn-dark" onclick="submitPost()">등록</button>
            </div>
        </div>
    </div>

    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const boardId = params.get('boardId');

        if (!boardId) window.location.replace('/index.html');
        if (!localStorage.getItem('accessToken')) window.location.replace('/login.html');

        document.getElementById('back-link').href = `/board.html?boardId=${boardId}`;

        function goBack() {
            window.location.href = `/board.html?boardId=${boardId}`;
        }

        document.getElementById('title-input').addEventListener('input', function () {
            document.getElementById('title-count').textContent = this.value.length;
        });

        // Toast UI Editor 초기화
        const editor = new toastui.Editor({
            el: document.getElementById('editor'),
            height: '500px',
            initialEditType: 'wysiwyg',
            previewStyle: 'vertical',
            placeholder: '내용을 입력하세요',
            hooks: {
                // 이미지 업로드 훅 - Presigned URL 방식
                addImageBlobHook: async (blob, callback) => {
                    try {
                        // 1. Presigned URL 발급 요청
                        const presignRes = await fetch(`${API_BASE}/api/boards/${boardId}/posts/presigned-url`, {
                            method: 'POST',
                            headers: authHeaders(),
                            body: JSON.stringify({
                                fileName: blob.name || `image_${Date.now()}`,
                                contentType: blob.type
                            })
                        });

                        if (!presignRes.ok) {
                            alert('이미지 업로드 URL 발급에 실패했습니다.');
                            callback('', '이미지 업로드 실패');
                            return;
                        }

                        const presignJson = await presignRes.json();
                        const { presignedUrl, imageUrl } = presignJson.data;

                        // 2. Presigned URL로 S3에 직접 업로드
                        const uploadRes = await fetch(presignedUrl, {
                            method: 'PUT',
                            headers: { 'Content-Type': blob.type },
                            body: blob
                        });

                        if (!uploadRes.ok) {
                            alert('이미지 S3 업로드에 실패했습니다.');
                            callback('', '이미지 업로드 실패');
                            return;
                        }

                        // 3. 에디터에 이미지 URL 삽입
                        callback(imageUrl, blob.name || '이미지');

                    } catch (e) {
                        alert('이미지 업로드 중 오류가 발생했습니다.');
                        callback('', '이미지 업로드 실패');
                    }
                }
            }
        });

        async function submitPost() {
            const title = document.getElementById('title-input').value.trim();
            const content = editor.getHTML();

            if (!title) { alert('제목을 입력해주세요.'); return; }
            if (!content || content === '<p><br></p>') { alert('내용을 입력해주세요.'); return; }

            try {
                const res = await fetch(`${API_BASE}/api/boards/${boardId}/posts`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ title, content })
                });
                const json = await res.json();

                if (res.ok) {
                    window.location.replace(`/post.html?boardId=${boardId}&postId=${json.data.postId}`);
                } else {
                    alert(json.message || '게시글 등록에 실패했습니다.');
                }
            } catch (e) {
                alert('서버 연결에 실패했습니다.');
            }
        }
    </script>
</body>
</html>
