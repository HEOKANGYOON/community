<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 500; }
        .board-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            cursor: pointer;
            transition: border-color 0.15s;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .board-card:hover { border-color: #adb5bd; color: inherit; }
        .board-name { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
        .board-desc { font-size: 13px; color: #6c757d; margin: 0; }
        .board-category {
            font-size: 11px;
            color: #6c757d;
            background: #f1f3f5;
            border-radius: 4px;
            padding: 2px 8px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .section-title { font-size: 18px; font-weight: 500; margin-bottom: 1rem; }
        .empty-state { text-align: center; color: #adb5bd; padding: 3rem 0; font-size: 14px; }
    </style>
    <script src="/js/nav.js"></script>
</head>
<body>
    <!-- 네비게이션 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" href="/index.html">커뮤니티</a>
            <div class="ms-auto d-flex align-items-center gap-2" id="nav-auth">
                <!-- JS로 렌더링 -->
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="loading" class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            불러오는 중...
        </div>

        <div id="board-container" style="display:none;">
            <p class="section-title">게시판 목록</p>
            <div id="board-list" class="row g-3"></div>
        </div>

        <div id="empty-state" class="empty-state" style="display:none;">
            게시판이 없습니다.
        </div>
    </div>

    <script>
        async function loadBoards() {
            try {
                const res = await fetch(`${API_BASE}/api/boards`, {
                    headers: authHeaders()
                });
                const json = await res.json();

                document.getElementById('loading').style.display = 'none';

                if (!res.ok) {
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }

                const boards = json.data;
                if (!boards || boards.length === 0) {
                    document.getElementById('empty-state').style.display = 'block';
                    return;
                }

                // 카테고리별 그룹핑
                const grouped = boards.reduce((acc, board) => {
                    const cat = board.categoryName || '기타';
                    if (!acc[cat]) acc[cat] = [];
                    acc[cat].push(board);
                    return acc;
                }, {});

                const container = document.getElementById('board-list');
                container.innerHTML = '';

                Object.entries(grouped).forEach(([category, list]) => {
                    const section = document.createElement('div');
                    section.className = 'col-12';
                    section.innerHTML = `<p class="text-muted small fw-500 mb-2 mt-2">${category}</p>`;
                    container.appendChild(section);

                    list.forEach(board => {
                        const col = document.createElement('div');
                        col.className = 'col-md-6 col-lg-4';
                        col.innerHTML = `
                            <a href="/board.html?boardId=${board.id}" class="board-card">
                                <div class="board-name">${board.name}</div>
                                <p class="board-desc">${board.description || '설명 없음'}</p>
                            </a>
                        `;
                        container.appendChild(col);
                    });
                });

                document.getElementById('board-container').style.display = 'block';

            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('empty-state').style.display = 'block';
            }
        }
        loadBoards();
    </script>
</body>
</html>
